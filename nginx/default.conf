# Sitio estático (build de Vite) servido en la raíz del dominio.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # JS y CSS compilados (Vite los deja en /build/ con hash en el nombre):
    # caché de un año; si no existen, 404.
    location /build/ {
        expires 1y;
        try_files $uri =404;
    }

    # Imágenes de public/assets: no llevan hash, así que caché corta.
    location /assets/ {
        expires 1d;
        try_files $uri =404;
    }

    # Las rutas del sitio (/, /la-biblia-en-365-dias/, /:slug/) las resuelve
    # React: cualquier otra ruta entrega index.html, sin caché.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
